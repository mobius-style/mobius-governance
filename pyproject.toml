[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobius-governance"
version = "0.8.2"
description = "Bounded context scanning and action mediation for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Taiko Toeda" }]
keywords = [
  "llm", "governance", "guardrails", "context-governance", "rag",
  "prompt-injection", "openai-compatible", "local-first", "mobius",
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
dependencies = []

[project.optional-dependencies]
govern = ["rcgov @ git+https://github.com/mobius-style/rcgov.git"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mobius-governance = "mobius_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobius_governance = ["data/*.json"]

